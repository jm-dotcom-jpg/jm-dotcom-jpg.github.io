
<!-- All of the html documents must start with a doctype declaration -->
<!DOCTYPE html>
<!-- The html element is the root element of an html page -->
<html lang="en">
    <!-- The head element contains meta information about the document -->
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Html Site</title>
</head>
<!-- The body element contains the visible page content -->
<body>
    <!-- The h1 element defines a large heading -->
    <h1>Hola GIGA</h1>

    <!-- The p element defines a paragraph -->
    <p> How was your day?</p>
    <p> hello, so this is my first ever html webpage 
        <br>actually not first since I've made a few others <br>before this one</p>

        <p> So what's the catch? I just want you to 
            <br> click the link to view my facebook account 
            <br> and tell me if it's working. thanksss! </p>
    <!-- The <a> element defines a hyperlink -->
    <img src ="https://static.freepnglogo.com/images/all_img/facebook-circle-logo-png.png" 
    alt="Clink the link to view my facebook account" width="30" height="30">
    <br>
    <a href="https://www.youtube.com/watch?v=xvFZjo5PgG0">Facebook.com</a>
</body>
</html>
